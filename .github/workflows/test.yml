name: Test MK Calculator

on:
  pull_request:
  push:
    branches:
      - main
      - 'work/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check math-bot.js
          node --check math-bot-client.js
          node --check sw.js
      - name: Run automated tests
        run: node --experimental-strip-types --test tests/*.test.js
